name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fix esbuild version for Vite 8
        run: npm install --save-dev esbuild@^0.28.0
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android && npm install --save-dev @capacitor/cli
      - run: npm run build
      - name: Add Android
        run: |
          [ -f capacitor.config.json ] || [ -f capacitor.config.ts ] || npx cap init "Game Demo" com.mrdevstudent.gamedemo --web-dir=dist
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Build APK
